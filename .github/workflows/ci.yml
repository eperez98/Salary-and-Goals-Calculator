name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Tipos · Pruebas · Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Pruebas unitarias e integración (SQLite)
        run: npm test
      - name: Compilar frontend
        run: npm run build

  windows:
    name: Build Windows (instalador) y prueba de instalación
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Pruebas de Rust (actualizador)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Compilar aplicación e instaladores
        run: npx tauri build
      - name: Prueba de instalación, ejecución y desinstalación
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./scripts/windows-smoke-test.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: monto-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
